name: Portable knowledge video skill checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: skills/vibe-knowledge-video/requirements.txt
      - run: python -m pip install -r skills/vibe-knowledge-video/requirements.txt
      - run: python -m unittest discover -s tests -v
  starter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/vibe-knowledge-video/assets/starter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: skills/vibe-knowledge-video/assets/starter/package-lock.json
      - run: npm ci
      - run: npm run setup -- --silent
      - run: npm run check
      - run: npm run test:setup
